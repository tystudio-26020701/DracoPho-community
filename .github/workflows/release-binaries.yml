name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.2'
        required: true
        type: string
      upload_to_release:
        description: 'Attach manual-run binary assets to the GitHub Release matching tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    name: Build Linux x86_64 binary package
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Resolve tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "No release tag was provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake \
            gcc \
            ninja \
            onnxruntime-cpu \
            pkgconf \
            pipewire \
            protobuf \
            qt6-base \
            qt6-wayland \
            zxing-cpp \
            layer-shell-qt

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Package install tree
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/app"
          install -Dm644 LICENSE app/share/licenses/dracoPho/LICENSE
          install -Dm644 README.md app/share/doc/dracoPho/README.md
          install -Dm644 README.zh-CN.md app/share/doc/dracoPho/README.zh-CN.md

          ASSET="dracoPho-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz"
          tar -C app -czf "$ASSET" .
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Package plugin assets
        shell: bash
        run: |
          mkdir -p plugin-assets
          plugins=()
          while IFS= read -r -d '' plugin; do
            plugins+=("$plugin")
          done < <(find app -type f -path '*/dracoPho/plugins/*' -name '*.so' -print0)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo "No provider plugin dynamic libraries were installed" >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            base="$(basename "$plugin")"
            provider="${base#libdracoPho-}"
            provider="${provider%.so}"
            asset="dracoPho-plugin-${provider}-${{ steps.version.outputs.tag }}-linux-x86_64.so"
            cp "$plugin" "plugin-assets/$asset"
            (cd plugin-assets && sha256sum "$asset" > "$asset.sha256")
          done

      - name: Upload binaries to release
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_to_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dracoPho-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz
            dracoPho-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz.sha256
            plugin-assets/*

      - name: Upload binaries artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dracoPho-linux-x86_64-${{ steps.version.outputs.tag }}
          path: |
            dracoPho-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz
            dracoPho-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz.sha256
            plugin-assets/*
          if-no-files-found: error

  linux-arm64:
    name: Build Linux arm64 binary package
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Resolve tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "No release tag was provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libpipewire-0.3-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcomposite-dev \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Package install tree
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/app"
          install -Dm644 LICENSE app/share/licenses/dracoPho/LICENSE
          install -Dm644 README.md app/share/doc/dracoPho/README.md
          install -Dm644 README.zh-CN.md app/share/doc/dracoPho/README.zh-CN.md

          ASSET="dracoPho-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz"
          tar -C app -czf "$ASSET" .
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Package plugin assets
        shell: bash
        run: |
          mkdir -p plugin-assets
          plugins=()
          while IFS= read -r -d '' plugin; do
            plugins+=("$plugin")
          done < <(find app -type f -path '*/dracoPho/plugins/*' -name '*.so' -print0)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo "No provider plugin dynamic libraries were installed" >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            base="$(basename "$plugin")"
            provider="${base#libdracoPho-}"
            provider="${provider%.so}"
            asset="dracoPho-plugin-${provider}-${{ steps.version.outputs.tag }}-linux-arm64.so"
            cp "$plugin" "plugin-assets/$asset"
            (cd plugin-assets && sha256sum "$asset" > "$asset.sha256")
          done

      - name: Upload binaries to release
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_to_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dracoPho-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz
            dracoPho-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz.sha256
            plugin-assets/*

      - name: Upload binaries artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dracoPho-linux-arm64-${{ steps.version.outputs.tag }}
          path: |
            dracoPho-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz
            dracoPho-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz.sha256
            plugin-assets/*
          if-no-files-found: error

  windows:
    name: Build Windows x86_64 binary package
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Resolve tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "No release tag was provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Fetch release-tooling files from default branch
        # 历史 tag 源码不含本轮新增的辅助文件（.iss 模板 / 静态 FFmpeg 脚本），
        # 从默认分支（main）拉取，保证回填历史发布版时工具链可用。
        # 注意：在 Set up MSYS2 之前执行，必须显式用 bash（Git Bash），
        # 不能用 job 默认的 msys2 shell（此时 MSYS2 尚未安装）。
        shell: bash
        run: |
          git fetch origin "${GITHUB_REF_NAME:-main}" --depth=1 || true
          git fetch origin main --depth=1 || true
          for f in packaging/windows/dracoPho-setup.iss scripts/build-static-ffmpeg.sh; do
            git checkout origin/main -- "$f" 2>/dev/null || git checkout "${GITHUB_REF_NAME:-main}" -- "$f" 2>/dev/null || true
          done
          test -f packaging/windows/dracoPho-setup.iss && echo "iss OK" || echo "iss MISSING"
          test -f scripts/build-static-ffmpeg.sh && echo "ffmpeg-script OK" || echo "ffmpeg-script MISSING"

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-onnxruntime
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-zxing-cpp

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMARK_SHOT_REQUIRE_FFMPEG=ON \
            -DMARK_SHOT_WITH_LAYER_SHELL=OFF \
            -DMARK_SHOT_WITH_LIBPORTAL=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package install tree
        id: package
        run: |
          cmake --install build --prefix "$PWD/app"
          # 产物名随 tag 源码而定：历史 tag 为 mark-shot，当前为 dracoPho。
          EXE_NAME="$(basename "$(find app/bin -maxdepth 1 -name '*.exe' | head -1)")"
          PRODUCT="${EXE_NAME%.exe}"
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "exe_name=$EXE_NAME" >> "$GITHUB_OUTPUT"
          # 同时写入 GITHUB_ENV 供后续 shell 步骤使用。
          {
            echo "exe_name=$EXE_NAME"
            echo "product=$PRODUCT"
          } >> "$GITHUB_ENV"
          echo "Detected product: $PRODUCT / exe: $EXE_NAME"
          for plugin in ocr-rapid translate-openai code-scan-zxing; do
            test -f "$PWD/app/lib/$PRODUCT/plugins/$PRODUCT-${plugin}.dll" || {
              echo "Expected provider plugin was not installed: ${plugin}" >&2
              exit 1
            }
          done
          install -Dm644 LICENSE "app/share/licenses/$PRODUCT/LICENSE"
          install -Dm644 README.md "app/share/doc/$PRODUCT/README.md"
          install -Dm644 README.zh-CN.md "app/share/doc/$PRODUCT/README.zh-CN.md"

      - name: Deploy runtime libraries
        run: |
          bash scripts/windows-deploy-runtime.sh "$PWD/app/bin" "$PWD/app/bin/$exe_name"

      - name: Sign Windows binaries
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          ./scripts/windows-sign-artifact.ps1 -Path "$env:GITHUB_WORKSPACE/app"

      - name: Package zip
        run: |
          ASSET="$product-${{ steps.version.outputs.tag }}-windows-x86_64.zip"
          (cd app && zip -r "../$ASSET" .)
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Package plugin assets
        run: |
          mkdir -p plugin-assets
          plugins=()
          while IFS= read -r -d '' plugin; do
            plugins+=("$plugin")
          done < <(find app -type f -path "*/$product/plugins/*" -name '*.dll' -print0)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo "No provider plugin dynamic libraries were installed" >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            base="$(basename "$plugin")"
            provider="${base#$product-}"
            provider="${provider%.dll}"
            asset="$product-plugin-${provider}-${{ steps.version.outputs.tag }}-windows-x86_64.dll"
            cp "$plugin" "plugin-assets/$asset"
            (cd plugin-assets && sha256sum "$asset" > "$asset.sha256")
          done

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $product = $env:product
          $exeName = $env:exe_name
          if ([string]::IsNullOrWhiteSpace($product)) { throw "product env is empty" }
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup ISCC.exe was not found" }
          # 历史 tag 只有 mark-shot.ico，当前有 DracoPho-logo.ico。
          $icon = "data\icons\DracoPho-logo.ico"
          if (-not (Test-Path $icon)) { $icon = "packaging\windows\mark-shot.ico" }
          & $iscc.Source "packaging\windows\dracoPho-setup.iss" `
            /DMyAppVersion="$env:APP_VERSION" `
            /DMyAppTag="$env:APP_TAG" `
            /DMyExeName="$exeName" `
            /DMyProductName="$product" `
            /DMySourceDir="$env:GITHUB_WORKSPACE\app" `
            /DMyIconFile="$env:GITHUB_WORKSPACE\$icon"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem "." -Filter "$product-$env:APP_TAG-windows-x86_64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Inno Setup did not produce $product-$env:APP_TAG-windows-x86_64-setup.exe" }
          Get-FileHash $setup.FullName -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($setup.Name)" | Set-Content "$($setup.Name).sha256"
          }
          echo "setup_name=$($setup.Name)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Upload binaries to release
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_to_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64.zip
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64.zip.sha256
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64-setup.exe
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64-setup.exe.sha256
            plugin-assets/*

      - name: Upload binaries artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.product }}-windows-x86_64-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64.zip
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64.zip.sha256
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64-setup.exe
            ${{ steps.package.outputs.product }}-${{ steps.version.outputs.tag }}-windows-x86_64-setup.exe.sha256
            plugin-assets/*
          if-no-files-found: error

  windows-static:
    name: Build Windows x86_64 static single-file exe
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Resolve tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "No release tag was provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Fetch static-build script from default branch
        # 在 Set up MSYS2 之前执行，必须显式用 bash（Git Bash）。
        shell: bash
        run: |
          git fetch origin main --depth=1 || true
          git checkout origin/main -- scripts/build-static-ffmpeg.sh 2>/dev/null || true
          test -f scripts/build-static-ffmpeg.sh && echo "ffmpeg-script OK" || echo "ffmpeg-script MISSING"

      - name: Set up MSYS2 (static toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-loader

      - name: Install static Qt6 from Tsinghua mirror
        # 主镜像 mirror.msys2.org 未同步 mingw-w64-qt6-static；清华镜像完整。
        # 元包为完整静态 Qt6（lib/include/cmake 俱全，仅依赖 vulkan-loader），
        # 手动下载并用 pacman -U 安装，绕开主镜像缺失。
        shell: bash
        run: |
          QT6_STATIC_VER="6.11.1-1"
          PKG="mingw-w64-ucrt-x86_64-qt6-static-${QT6_STATIC_VER}-any"
          curl -fL --retry 5 --retry-delay 2 -o "$PKG.pkg.tar.zst" \
            "https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/ucrt64/${PKG}.pkg.tar.zst"
          pacman -U --noconfirm "./$PKG.pkg.tar.zst"
          test -d /ucrt64/qt6-static/lib/cmake/Qt6 && echo "static Qt6 OK"
          ls /ucrt64/qt6-static/bin/ | head -3

      - name: Build static FFmpeg (MIT-compatible minimal LGPL)
        run: |
          bash scripts/build-static-ffmpeg.sh "$PWD/ffmpeg-src" "$PWD/ffmpeg-static"
          echo "FFMPEG_STATIC=$PWD/ffmpeg-static" >> "$GITHUB_ENV"

      - name: Detect product name
        id: product
        shell: bash
        run: |
          # 从源码工程名探测产物名（历史 tag = mark-shot，当前 = dracoPho）。
          PROJECT_NAME="$(grep -oP 'project\(\K[^ )]+' CMakeLists.txt | head -1)"
          echo "project=$PROJECT_NAME"
          echo "project=$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Configure (static)
        run: |
          # 静态 Qt6 安装到 /ucrt64/qt6-static；静态 FFmpeg 用 MINGW_PREFIX 查找。
          # 静态 FFmpeg/Qt 依赖系统库，用 --start-group 允许循环解析
          # （系统库名可能在 FFmpeg 目标库之前）。
          export MINGW_PREFIX="$FFMPEG_STATIC"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/ucrt64/qt6-static" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,--start-group -lws2_32 -lbcrypt -lsecur32 -lcrypt32 -luser32 -lgdi32 -lshell32 -lole32 -ladvapi32 -lwinmm -limm32 -loleaut32 -lversion -lshlwapi -Wl,--end-group" \
            -DMARK_SHOT_REQUIRE_FFMPEG=ON \
            -DMARK_SHOT_WITH_LAYER_SHELL=OFF \
            -DMARK_SHOT_WITH_LIBPORTAL=OFF \
            -DBUILD_TESTING=OFF

      - name: Build (static)
        run: |
          cmake --build build --target "$PROJECT" --parallel

      - name: Package static exe
        id: static-package
        run: |
          ASSET="$PROJECT-${{ steps.version.outputs.tag }}-windows-x86_64-static.exe"
          cp "build/$PROJECT.exe" "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          # 校验无外部 DLL 依赖（仅系统 DLL 可保留）。
          if command -v objdump >/dev/null 2>&1; then
            echo "=== DLL imports (system-only expected) ==="
            objdump -p "$ASSET" | awk '/DLL Name:/{print $3}'
          fi
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Upload static exe to release
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_to_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ${{ steps.static-package.outputs.asset }}
            ${{ steps.static-package.outputs.asset }}.sha256

      - name: Upload static exe artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.project }}-windows-x86_64-static-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.static-package.outputs.asset }}
            ${{ steps.static-package.outputs.asset }}.sha256
          if-no-files-found: error
